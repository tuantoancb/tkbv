<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thời khóa biểu giáo viên</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6f8;font-family:Arial,Helvetica,sans-serif;color:#111827}
    .page{max-width:1800px;margin:auto;padding:16px}
    h1{text-align:center;font-size:24px;margin:4px 0 14px}
    .controls{
      background:#fff;border:1px solid #d1d5db;border-radius:12px;
      padding:12px;display:grid;grid-template-columns:1fr 220px auto auto;
      gap:10px;align-items:end;margin-bottom:10px
    }
    label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
    input[type="text"]{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font-size:14px}
    .options{
      background:#fff;border:1px solid #d1d5db;border-radius:10px;
      padding:9px 12px;margin-bottom:12px;display:flex;gap:20px;align-items:center;flex-wrap:wrap
    }
    .check{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;cursor:pointer}
    .check input{width:17px;height:17px}
    button{height:40px;border:0;border-radius:8px;padding:0 15px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb;color:#111827}
    .status{text-align:center;color:#475569;min-height:22px;margin:5px 0 9px}
    .result-title{text-align:center;font-size:20px;font-weight:800;margin:8px 0 10px}
    .table-box{background:#fff;overflow:auto;border:1px solid #4b5563}
    table{
      border-collapse:collapse;
      width:max-content;
      min-width:0;
      table-layout:auto;
      font-size:12px
    }
    th,td{
      border:1px solid #777;text-align:center;vertical-align:middle;
      padding:3px 6px;height:37px;line-height:1.08
    }
    thead th{background:#f3f4f6;font-weight:800;height:48px;white-space:nowrap}
    .day-h{width:42px}.session-h{width:54px}.period-h{width:38px}
    .class-h{width:auto;min-width:58px;white-space:nowrap}
    .day{background:#fff900;font-weight:800;font-size:13px;white-space:pre-line}
    .morning{background:#08e91d;font-weight:800}
    .afternoon{background:#fff0ae;font-weight:800}
    .evening{background:#a9a9a9;font-weight:800}
    .teacher-cell{font-weight:700;white-space:nowrap;width:auto}
    .blank{color:transparent;min-width:58px}
    .hint{font-size:12px;color:#64748b;text-align:center;margin-top:7px}
    .empty-message{
      background:#fff;border:1px solid #d1d5db;border-radius:10px;
      padding:22px;text-align:center;color:#64748b;font-weight:700
    }
    @media(max-width:850px){
      .controls{grid-template-columns:1fr}
      .page{padding:8px}
    }
    @media print{
      body{background:#fff}
      .controls,.options,.status,.hint,h1{display:none!important}
      .page{max-width:none;padding:0}
      .table-box{border:0;overflow:visible}
      table{font-size:8.5px}
      th,td{height:27px;padding:1px 3px}
      .result-title{font-size:14px;margin:2px 0 5px}
    }
  </style>
</head>
<body>
<div class="page">
  <h1>THỜI KHÓA BIỂU GIÁO VIÊN</h1>

  <div class="controls">
    <div>
      <label>Link Google Sheets</label>
      <input type="text" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/.../edit?gid=...">
    </div>
    <div>
      <label>Tên giáo viên</label>
      <input type="text" id="teacher" placeholder="Ví dụ: T.Tuấn hoặc T. Tuấn">
    </div>
    <button class="primary" id="viewBtn">Xem thời khóa biểu</button>
    <button class="secondary" onclick="window.print()">In / Lưu PDF</button>
  </div>

  <div class="options">
    <label class="check">
      <input type="checkbox" id="showEvening" checked>
      Hiện buổi tối
    </label>
    <label class="check">
      <input type="checkbox" id="showSunday" checked>
      Hiện Chủ nhật
    </label>
    <span style="font-size:12px;color:#64748b">
      Cột lớp không có tiết của giáo viên sẽ tự động được ẩn.
    </span>
  </div>

  <div id="status" class="status"></div>
  <div id="result"></div>
  <div class="hint">Google Sheet cần bật quyền “Bất kỳ ai có đường liên kết đều có thể xem”.</div>
</div>

<script>
const $ = id => document.getElementById(id);
let lastData = null;

$('viewBtn').addEventListener('click', loadSchedule);
$('teacher').addEventListener('keydown', e => { if(e.key === 'Enter') loadSchedule(); });
$('showEvening').addEventListener('change', () => { if(lastData) render(lastData); });
$('showSunday').addEventListener('change', () => { if(lastData) render(lastData); });

async function loadSchedule(){
  const url = $('sheetUrl').value.trim();
  const teacher = $('teacher').value.trim();

  if(!url || !teacher){
    $('status').textContent = 'Vui lòng nhập link Google Sheets và tên giáo viên.';
    return;
  }

  $('status').textContent = 'Đang đọc thời khóa biểu...';
  $('result').innerHTML = '';
  $('viewBtn').disabled = true;

  try{
    const r = await fetch('/api/schedule?url=' + encodeURIComponent(url) + '&teacher=' + encodeURIComponent(teacher));
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || 'Không đọc được dữ liệu.');
    lastData = data;
    render(data);
  }catch(e){
    lastData = null;
    $('status').textContent = 'Lỗi: ' + e.message;
  }finally{
    $('viewBtn').disabled = false;
  }
}

function render(data){
  const showEvening = $('showEvening').checked;
  const showSunday = $('showSunday').checked;

  const visibleRows = data.rows.filter(row => {
    const session = String(row.session || '').toLowerCase();
    const day = String(row.day || '').toLowerCase();

    if(!showEvening && session.includes('tối')) return false;
    if(!showSunday && (day === 'cn' || day.includes('chủ nhật'))) return false;
    return true;
  });

  const activeClassIndexes = [];
  data.classes.forEach((cls, idx) => {
    if(visibleRows.some(row => row.cells[idx])) activeClassIndexes.push(idx);
  });

  const visibleMatchCount = visibleRows.reduce((sum, row) => {
    return sum + activeClassIndexes.reduce((n, idx) => n + (row.cells[idx] ? 1 : 0), 0);
  }, 0);

  $('status').textContent =
    `Hiển thị ${visibleMatchCount} tiết của ${data.teacher} • ${activeClassIndexes.length} lớp có lịch`;

  if(!visibleMatchCount || !activeClassIndexes.length){
    $('result').innerHTML = `<div class="empty-message">Không có tiết phù hợp với lựa chọn hiện tại.</div>`;
    return;
  }

  const dayGroups = groupDays(visibleRows);

  let h = `<div class="result-title">THỜI KHÓA BIỂU - ${esc(data.teacher)}</div>`;
  h += `<div class="table-box"><table><thead><tr>`;
  h += `<th class="day-h"></th><th class="session-h">Buổi</th><th class="period-h">TIẾT</th>`;

  activeClassIndexes.forEach(idx => {
    h += `<th class="class-h">${esc(data.classes[idx])}</th>`;
  });

  h += `</tr></thead><tbody>`;

  dayGroups.forEach(day => {
    let firstDay = true;
    const daySpan = day.rows.length;

    day.sessions.forEach(session => {
      let firstSession = true;
      const sessionSpan = session.rows.length;

      session.rows.forEach(row => {
        h += '<tr>';

        if(firstDay){
          h += `<td class="day" rowspan="${daySpan}">${esc(day.day)}\n${esc(day.date)}</td>`;
          firstDay = false;
        }

        if(firstSession){
          h += `<td class="${sessionClass(session.name)}" rowspan="${sessionSpan}">${esc(session.name)}</td>`;
          firstSession = false;
        }

        h += `<td>${esc(row.period)}</td>`;

        activeClassIndexes.forEach(idx => {
          const cell = row.cells[idx];
          h += cell
            ? `<td class="teacher-cell">${esc(cell)}</td>`
            : `<td class="blank">&nbsp;</td>`;
        });

        h += '</tr>';
      });
    });
  });

  h += '</tbody></table></div>';
  $('result').innerHTML = h;
}

function groupDays(rows){
  const out = [];
  let dayKey = null, day = null, session = null;

  rows.forEach(row => {
    const key = row.dayRaw || `${row.day}|${row.date}`;

    if(key !== dayKey){
      dayKey = key;
      day = {day: row.day, date: row.date, rows: [], sessions: []};
      out.push(day);
      session = null;
    }

    day.rows.push(row);

    if(!session || session.name !== row.session){
      session = {name: row.session, rows: []};
      day.sessions.push(session);
    }

    session.rows.push(row);
  });

  return out;
}

function sessionClass(name){
  const s = String(name || '').toLowerCase();
  if(s.includes('sáng')) return 'morning';
  if(s.includes('chiều')) return 'afternoon';
  if(s.includes('tối')) return 'evening';
  return '';
}

function esc(v){
  return String(v ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#039;");
}
</script>
</body>
</html>
