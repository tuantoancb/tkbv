<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thời khóa biểu giáo viên</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6f8;font-family:'Times New Roman',Times,serif;color:#111827}
    .page{max-width:1800px;margin:auto;padding:16px}
    h1{text-align:center;font-size:24px;margin:4px 0 14px}
    .controls{
      background:#fff;border:1px solid #d1d5db;border-radius:12px;
      padding:12px;display:grid;grid-template-columns:1fr 220px auto auto auto;
      gap:10px;align-items:end;margin-bottom:10px
    }
    label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
    input[type="text"],select{width:100%;height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font-size:14px;font-family:'Times New Roman',Times,serif;background:#fff}
    .options{
      background:#fff;border:1px solid #d1d5db;border-radius:10px;
      padding:9px 12px;margin-bottom:12px;display:flex;gap:20px;align-items:center;flex-wrap:wrap
    }
    .check{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;cursor:pointer}
    .check input{width:17px;height:17px}
    button{height:40px;border:0;border-radius:8px;padding:0 15px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb;color:#111827}
    .status{text-align:center;color:#475569;min-height:22px;margin:5px 0 9px}
    .result-title{text-align:center;font-size:22px;font-weight:700;margin:10px 0 12px;letter-spacing:.2px}
    .table-box{background:#fff;overflow:auto;border:1px solid #4b5563}
    table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}
    th,td{
      border:1px solid #777;text-align:center;vertical-align:middle;
      padding:2px 3px;height:37px;white-space:pre-line;line-height:1.08
    }
    thead th{background:#f3f4f6;font-weight:800;height:48px}
    .day-h{width:42px}.session-h{width:54px}.period-h{width:38px}.class-h{width:82px}
    .day{background:#fff900;font-weight:800;font-size:13px}
    .morning{background:#08e91d;font-weight:800}
    .afternoon{background:#fff0ae;font-weight:800}
    .evening{background:#a9a9a9;font-weight:800}
    .teacher-cell{font-weight:700;white-space:nowrap;line-height:1.0;overflow:hidden;text-overflow:clip}
    .blank{color:transparent}
    .hint{font-size:12px;color:#64748b;text-align:center;margin-top:7px}
    .empty-message{
      background:#fff;border:1px solid #d1d5db;border-radius:10px;
      padding:22px;text-align:center;color:#64748b;font-weight:700
    }

    .exporting{
      background:#fff!important;
      padding:18px!important;
      width:max-content!important;
    }
    .exporting .result-title{
      font-size:24px!important;
      margin:0 0 14px!important;
      font-weight:700!important;
      font-family:'Times New Roman',Times,serif!important;
    }
    .exporting table{
      font-family:'Times New Roman',Times,serif!important;
      font-size:13px!important;
      min-width:0!important;
      width:auto!important;
    }
    .exporting th,.exporting td{
      height:38px!important;
      padding:3px 7px!important;
      border:1px solid #666!important;
      line-height:1.08!important;
    }
    .exporting thead th{
      height:46px!important;
      background:#f1f1f1!important;
    }
    .exporting .day-h{width:52px!important}
    .exporting .session-h{width:68px!important}
    .exporting .period-h{width:48px!important}
    .exporting .class-h{width:118px!important}
    .exporting .teacher-cell{
      white-space:nowrap!important;
      font-weight:600!important;
    }

    @media(max-width:850px){
      .controls{grid-template-columns:1fr}
      .page{padding:8px}
    }
    @media print{
      @page{margin:7mm}
      html,body{
        margin:0!important;padding:0!important;background:#fff!important;
        -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
      }
      .controls,.options,.status,.hint,h1{display:none!important}
      .page{max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
      #printArea{
        display:block!important;width:max-content!important;max-width:none!important;
        transform-origin:top left!important;page-break-inside:avoid!important;break-inside:avoid!important;
      }
      .result-title{
        font-family:'Times New Roman',Times,serif!important;
        font-size:var(--print-title,16px)!important;font-weight:700!important;
        margin:0 0 6px!important;text-align:center!important;
      }
      .table-box{border:0!important;overflow:visible!important;width:max-content!important;max-width:none!important}
      table{
        width:auto!important;min-width:0!important;table-layout:fixed!important;
        font-family:'Times New Roman',Times,serif!important;
        font-size:var(--print-font,9px)!important;
        page-break-inside:avoid!important;break-inside:avoid!important;
      }
      th,td{
        height:var(--print-row-h,25px)!important;min-height:var(--print-row-h,25px)!important;
        padding:1px 3px!important;line-height:1.05!important;border:1px solid #666!important;
      }
      thead th{
        height:var(--print-head-h,34px)!important;font-weight:700!important;
        background:#f1f1f1!important;
      }
      .day-h{width:44px!important}.session-h{width:56px!important}.period-h{width:40px!important}
      .class-h{width:var(--print-class-w,86px)!important}
      .teacher-cell{font-weight:600!important;white-space:nowrap!important;overflow:visible!important}
      .day{background:#fff900!important}.morning{background:#65d72e!important}
      .afternoon{background:#fff0ae!important}.evening{background:#aaa!important}
      tr,td,th{page-break-inside:avoid!important;break-inside:avoid!important}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
<div class="page">
  <h1>THỜI KHÓA BIỂU GIÁO VIÊN</h1>

  <div class="controls">
    <div>
      <label>Link Google Sheets</label>
      <input type="text" id="sheetUrl" placeholder="https://docs.google.com/spreadsheets/d/.../edit?gid=...">
    </div>
    <div>
      <label>Tên giáo viên</label>
      <select id="teacher">
        <option value="">-- Chọn giáo viên --</option>
      </select>
    </div>
    <button class="primary" id="viewBtn">Xem thời khóa biểu</button>
    <button class="secondary" onclick="printOnePage()">In thời khóa biểu</button>
    <button class="secondary" id="pngBtn" onclick="exportPNG()">Xuất ảnh PNG</button>
  </div>

  <div class="options">
    <label class="check">
      <input type="checkbox" id="showAfternoon" checked>
      Hiện buổi chiều
    </label>
    <label class="check">
      <input type="checkbox" id="showEvening" checked>
      Hiện buổi tối
    </label>
    <label class="check">
      <input type="checkbox" id="showSunday" checked>
      Hiện Chủ nhật
    </label>
    <label class="check">
      Kiểu in
      <select id="printMode" style="width:auto;height:32px;padding:0 8px">
        <option value="auto">Tự động</option>
        <option value="portrait">Dọc</option>
        <option value="landscape">Ngang</option>
      </select>
    </label>
    <span style="font-size:12px;color:#64748b">
      Các cột lớp không có tiết của giáo viên sẽ tự động được ẩn.
    </span>
  </div>

  <div id="status" class="status"></div>
  <div id="printArea"><div id="result"></div></div>
  <div class="hint">Google Sheet cần bật quyền “Bất kỳ ai có đường liên kết đều có thể xem”.</div>
</div>

<script>
const $ = id => document.getElementById(id);
let lastData = null;

$('viewBtn').addEventListener('click', loadSchedule);
$('sheetUrl').addEventListener('change', loadTeachers);
$('sheetUrl').addEventListener('blur', loadTeachers);
$('showAfternoon').addEventListener('change', () => {
  if(lastData) render(lastData);
});
$('showEvening').addEventListener('change', () => {
  if(lastData) render(lastData);
});
$('showSunday').addEventListener('change', () => {
  if(lastData) render(lastData);
});

let lastTeacherSourceUrl = '';

async function loadTeachers(){
  const url = $('sheetUrl').value.trim();
  if(!url || url === lastTeacherSourceUrl) return;

  const select = $('teacher');
  const previous = select.value;
  select.innerHTML = '<option value="">Đang tải danh sách...</option>';
  select.disabled = true;

  try{
    const r = await fetch('/api/teachers?url=' + encodeURIComponent(url));
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || 'Không đọc được danh sách giáo viên.');

    select.innerHTML = '<option value="">-- Chọn giáo viên --</option>';
    data.teachers.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = formatTeacherDisplay(name);
      select.appendChild(opt);
    });

    if(previous && data.teachers.includes(previous)) select.value = previous;
    lastTeacherSourceUrl = url;
    $('status').textContent = `Đã tìm thấy ${data.teachers.length} giáo viên trong bảng TKB.`;
  }catch(e){
    select.innerHTML = '<option value="">-- Không tải được danh sách --</option>';
    $('status').textContent = 'Lỗi danh sách giáo viên: ' + e.message;
  }finally{
    select.disabled = false;
  }
}

function formatTeacherDisplay(name){
  return String(name || '').replace(/([A-Za-zÀ-ỹĐđ])\.(?=\S)/g, '$1. ');
}

async function loadSchedule(){
  const url = $('sheetUrl').value.trim();
  const teacher = $('teacher').value.trim();

  if(!url || !teacher){
    $('status').textContent = 'Vui lòng nhập link Google Sheets và tên giáo viên.';
    return;
  }

  $('status').textContent = 'Đang đọc thời khóa biểu...';
  $('result').innerHTML = '';
  $('viewBtn').disabled = true;

  try{
    const r = await fetch('/api/schedule?url=' + encodeURIComponent(url) + '&teacher=' + encodeURIComponent(teacher));
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || 'Không đọc được dữ liệu.');
    lastData = data;
    render(data);
  }catch(e){
    lastData = null;
    $('status').textContent = 'Lỗi: ' + e.message;
  }finally{
    $('viewBtn').disabled = false;
  }
}

function render(data){
  const showAfternoon = $('showAfternoon').checked;
  const showEvening = $('showEvening').checked;
  const showSunday = $('showSunday').checked;

  // Lọc theo lựa chọn Buổi tối và Chủ nhật.
  const visibleRows = data.rows.filter(row => {
    const session = String(row.session || '').toLowerCase();
    const dayRaw = String(row.dayRaw || '').toLowerCase();
    const day = String(row.day || '').toLowerCase();

    if(!showAfternoon && session.includes('chiều')) return false;
    if(!showEvening && session.includes('tối')) return false;

    const isSunday =
      day.includes('cn') ||
      day.includes('chủ nhật') ||
      dayRaw.split(/\r?\n/)[0].trim() === 'CN' ||
      dayRaw.includes('chủ nhật');

    if(!showSunday && isSunday) return false;

    return true;
  });

  // Chỉ giữ các cột lớp có ít nhất một kết quả trong các hàng đang hiển thị.
  const activeClassIndexes = [];
  data.classes.forEach((cls, idx) => {
    const hasMatch = visibleRows.some(row => row.cells[idx]);
    if(hasMatch) activeClassIndexes.push(idx);
  });

  const visibleMatchCount = visibleRows.reduce((sum, row) => {
    return sum + activeClassIndexes.reduce((n, idx) => n + (row.cells[idx] ? 1 : 0), 0);
  }, 0);

  $('status').textContent =
    `Hiển thị ${visibleMatchCount} tiết của ${data.teacher} • ${activeClassIndexes.length} lớp có lịch`;

  if(!visibleMatchCount || !activeClassIndexes.length){
    $('result').innerHTML =
      `<div class="empty-message">Không có tiết phù hợp với lựa chọn hiện tại.</div>`;
    return;
  }

  const dayGroups = groupDays(visibleRows);
  let h = `<div class="result-title">THỜI KHÓA BIỂU - ${esc(data.teacher)}</div>`;
  h += `<div class="table-box"><table><thead><tr>`;
  h += `<th class="day-h"></th><th class="session-h">Buổi</th><th class="period-h">TIẾT</th>`;

  activeClassIndexes.forEach(idx => {
    h += `<th class="class-h">${esc(data.classes[idx])}</th>`;
  });

  h += `</tr></thead><tbody>`;

  dayGroups.forEach(day => {
    let firstDay = true;
    const daySpan = day.rows.length;

    day.sessions.forEach(session => {
      let firstSession = true;
      const sessionSpan = session.rows.length;

      session.rows.forEach(row => {
        h += '<tr>';

        if(firstDay){
          h += `<td class="day" rowspan="${daySpan}">${esc(day.day)}\n${esc(day.date)}</td>`;
          firstDay = false;
        }

        if(firstSession){
          h += `<td class="${sessionClass(session.name)}" rowspan="${sessionSpan}">${esc(session.name)}</td>`;
          firstSession = false;
        }

        h += `<td>${esc(row.period)}</td>`;

        activeClassIndexes.forEach(idx => {
          const cell = row.cells[idx];
          h += cell
            ? `<td class="teacher-cell">${esc(cell)}</td>`
            : `<td class="blank">&nbsp;</td>`;
        });

        h += '</tr>';
      });
    });
  });

  h += '</tbody></table></div>';
  $('result').innerHTML = h;
}

function groupDays(rows){
  const out = [];
  let dayKey = null, day = null, session = null;

  rows.forEach(row => {
    const key = row.dayRaw || `${row.day}|${row.date}`;

    if(key !== dayKey){
      dayKey = key;
      day = {day: row.day, date: row.date, rows: [], sessions: []};
      out.push(day);
      session = null;
    }

    day.rows.push(row);

    if(!session || session.name !== row.session){
      session = {name: row.session, rows: []};
      day.sessions.push(session);
    }

    session.rows.push(row);
  });

  return out;
}

function sessionClass(name){
  const s = String(name || '').toLowerCase();
  if(s.includes('sáng')) return 'morning';
  if(s.includes('chiều')) return 'afternoon';
  if(s.includes('tối')) return 'evening';
  return '';
}

function esc(v){
  return String(v ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#039;");
}


async function exportPNG(){
  if(!lastData){
    $('status').textContent='Hãy xem thời khóa biểu trước khi xuất ảnh.';
    return;
  }

  render(lastData);

  const area=document.getElementById('printArea');
  const result=area.querySelector('#result');
  if(!result || !result.querySelector('table')){
    $('status').textContent='Không có thời khóa biểu để xuất ảnh.';
    return;
  }

  const btn=$('pngBtn');
  btn.disabled=true;
  $('status').textContent='Đang tạo ảnh PNG...';

  // Tạo bản sao riêng để xuất ảnh, không làm thay đổi giao diện người dùng.
  const clone=area.cloneNode(true);
  clone.id='exportClone';
  clone.classList.add('exporting');

  Object.assign(clone.style,{
    position:'fixed',
    left:'-100000px',
    top:'0',
    zoom:'1',
    transform:'none',
    width:'max-content',
    maxWidth:'none',
    background:'#fff',
    zIndex:'-1'
  });

  document.body.appendChild(clone);

  try{
    if(typeof html2canvas!=='function'){
      throw new Error('Thư viện xuất ảnh chưa tải được. Hãy tải lại trang và thử lại.');
    }

    // Chờ font/layout ổn định.
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    const canvas=await html2canvas(clone,{
      backgroundColor:'#ffffff',
      scale:2,
      useCORS:true,
      logging:false,
      width:clone.scrollWidth,
      height:clone.scrollHeight,
      windowWidth:clone.scrollWidth,
      windowHeight:clone.scrollHeight
    });

    const teacher=(lastData.teacher || 'giao-vien')
      .replace(/[\\/:*?"<>|]+/g,'-')
      .replace(/\s+/g,'_');

    const link=document.createElement('a');
    link.download=`Thoi_khoa_bieu_${teacher}.png`;
    link.href=canvas.toDataURL('image/png',1.0);
    document.body.appendChild(link);
    link.click();
    link.remove();

    $('status').textContent=`Đã xuất ảnh thời khóa biểu của ${lastData.teacher}.`;
  }catch(e){
    $('status').textContent='Lỗi xuất ảnh: '+e.message;
  }finally{
    clone.remove();
    btn.disabled=false;
  }
}

function printOnePage(){
  if(!lastData){
    $('status').textContent='Hãy xem thời khóa biểu trước khi in.';
    return;
  }

  render(lastData);
  const area=document.getElementById('printArea');
  const table=area.querySelector('table');
  if(!table) return;

  const mode=$('printMode') ? $('printMode').value : 'auto';
  const rows=table.querySelectorAll('tbody tr').length;
  const cols=table.querySelectorAll('thead th').length;

  area.style.zoom='';
  ['--print-row-h','--print-head-h','--print-font','--print-class-w','--print-title']
    .forEach(x=>document.documentElement.style.removeProperty(x));

  // Tự động chọn vùng trang hợp lý theo số cột.
  let landscape = mode==='landscape' || (mode==='auto' && cols>=10);
  if(mode==='portrait') landscape=false;

  // Kích thước vùng in quy ước. Không khóa cứng @page để Chrome vẫn cho đổi giấy.
  const targetW=landscape ? 1040 : 750;
  const targetH=landscape ? 720 : 1040;

  // Tỷ lệ thẩm mỹ giống bản mẫu: hàng thoáng, chữ rõ.
  let rowH = rows<=34 ? 28 : rows<=42 ? 24 : rows<=50 ? 20 : 17;
  let font = cols<=8 ? 9.4 : cols<=11 ? 8.7 : 8.0;
  let classW = cols<=8 ? 105 : cols<=11 ? 88 : 76;
  let title = cols<=9 ? 17 : 15;

  document.documentElement.style.setProperty('--print-row-h',rowH+'px');
  document.documentElement.style.setProperty('--print-head-h',Math.max(31,rowH+7)+'px');
  document.documentElement.style.setProperty('--print-font',font+'px');
  document.documentElement.style.setProperty('--print-class-w',classW+'px');
  document.documentElement.style.setProperty('--print-title',title+'px');

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const contentW=Math.max(area.scrollWidth,table.scrollWidth);
    const contentH=area.scrollHeight;
    let scale=Math.min(targetW/contentW,targetH/contentH,1);

    // Nếu chỉ hơi tràn, co vừa đủ. Nếu bảng lớn, vẫn đảm bảo một trang.
    scale=Math.max(.32,scale);
    area.style.zoom=String(scale);

    const cleanup=()=>{
      area.style.zoom='';
      ['--print-row-h','--print-head-h','--print-font','--print-class-w','--print-title']
        .forEach(x=>document.documentElement.style.removeProperty(x));
      window.removeEventListener('afterprint',cleanup);
    };
    window.addEventListener('afterprint',cleanup);
    setTimeout(()=>window.print(),100);
  }));
}

</script>
</body>
</html>
